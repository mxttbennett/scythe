name: Scythe
options:
  bundleIdPrefix: com.mxttbennett
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"
    iOS: "18.0"
  groupSortPosition: top

packages:
  ScytheCore:
    path: Packages/ScytheCore

# Signing lives in an xcconfig so a checkout builds ad-hoc for anyone, while this
# machine can opt into a real team without editing a tracked file.
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.4"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Scythe:
    type: application
    platform: macOS
    sources:
      - path: Apps/Mac/Sources
    dependencies:
      - package: ScytheCore
        product: ScytheCore
    info:
      path: Apps/Mac/Resources/Info.plist
      properties:
        CFBundleName: Scythe
        CFBundleDisplayName: Scythe
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Menu bar app: no Dock icon, no main window on launch.
        LSUIElement: true
        NSHumanReadableCopyright: "MIT licensed"
    entitlements:
      path: Apps/Mac/Resources/Scythe.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mxttbennett.scythe
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES

  ScytheTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Apps/Mac/Tests
    dependencies:
      - target: Scythe
      - package: ScytheCore
        product: ScytheCore
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Scythe.app/Contents/MacOS/Scythe
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mxttbennett.scythe.tests

schemes:
  Scythe:
    build:
      targets:
        Scythe: all
        ScytheTests: [test]
    test:
      config: Debug
      targets:
        - ScytheTests
    run:
      config: Debug
